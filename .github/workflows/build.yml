
name: Deploy to Local Minikube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minikube-local
  cancel-in-progress: false

env:
  K8S_NAMESPACE: default
  DEPLOYMENT_NAME: python-app
  CONTAINER_NAME: python-app
  IMAGE_NAME: python-app

jobs:
  deploy:
    # Runs on your local machine using a self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check dependencies
        run: |
          docker --version
          minikube version
          kubectl version --client

      - name: Start Minikube
        run: |
          minikube status || minikube start \
            --driver=docker \
            --cpus=2 \
            --memory=4096

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:${GITHUB_SHA}" .

      - name: Load Docker image into Minikube
        run: |
          minikube image load \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Deploy to Kubernetes
        run: |
          kubectl config use-context minikube

          kubectl apply \
            -n "$K8S_NAMESPACE" \
            -f k8s/deployment.yaml

          kubectl apply \
            -n "$K8S_NAMESPACE" \
            -f k8s/service.yaml

      - name: Update deployment image
        run: |
          kubectl set image \
            "deployment/$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME=$IMAGE_NAME:${GITHUB_SHA}" \
            -n "$K8S_NAMESPACE"

      - name: Verify deployment
        run: |
          kubectl rollout status \
            "deployment/$DEPLOYMENT_NAME" \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

          kubectl get pods \
            -n "$K8S_NAMESPACE"

          kubectl get services \
            -n "$K8S_NAMESPACE"

      - name: Show logs on failure
        if: failure()
        run: |
          kubectl describe deployment "$DEPLOYMENT_NAME" \
            -n "$K8S_NAMESPACE" || true

          kubectl get pods \
            -n "$K8S_NAMESPACE" || true
